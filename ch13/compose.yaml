services:
  shipping-specialist:
    build:
      context: ..
      dockerfile: ch13/Dockerfile
    image: ch13-a2a-shipping-specialist:latest
    ports:
      - "8001:8001"
    environment:
      LLM_PROVIDER: "${LLM_PROVIDER:-ollama}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-gemma4:12b}"
      # Do not use localhost here: Ollama runs on the Docker host.
      OLLAMA_BASE_URL: "${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11434}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-deepseek-chat}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
      DEEPSEEK_THINKING: "${DEEPSEEK_THINKING:-disabled}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-flash-latest}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      # Uvicorn binds to 0.0.0.0; this is the address published in the card.
      A2A_SERVER_HOST: "${A2A_SERVER_HOST:-127.0.0.1}"
      A2A_SERVER_PORT: "8001"
      A2A_SERVER_PROTOCOL: "http"
    extra_hosts:
      # Docker Desktop already provides this name; host-gateway also supports
      # a native Linux Docker Engine.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
